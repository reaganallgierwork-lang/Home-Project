<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ascent</title>

  <!-- Content-Security-Policy: the app's seatbelt.
       Everything here runs on your phone and your data never leaves it, so
       this policy is deliberately tight — it says, in order: run no code
       except JavaScript files served from this app; allow styles from here
       and Google Fonts; allow images only from here or embedded data: URLs
       (that is what a progress photo is); and — the important one —
       connect-src 'self' means the page cannot send anything to any other
       server. Even if something malformed ever did get rendered as markup,
       it would have nowhere to send your data and no way to load code.
       There is no 'unsafe-inline' for scripts, which is why the boot code
       lives in js/boot.js rather than in a <script> block below. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self';
    manifest-src 'self';
    worker-src 'self';
    base-uri 'none';
    form-action 'none';
  ">

  <!-- viewport-fit=cover lets the app paint under the notch and home indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="description" content="Ascent — fitness, habits, legacy. Track habits, build streaks, earn badges.">
  <meta name="theme-color" content="#0B0D11">
  <meta name="color-scheme" content="dark">

  <!-- iOS: these are what make "Add to Home Screen" open full screen with no
       Safari chrome, like a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ascent">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- Anton for display type, Inter for everything else. Both fall back to
       the system face, so the app is fully legible before they land — and the
       service worker caches them after the first online load, so it stays that
       way offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Both the screens and the tab bar are built by ui.js from its SCREENS
       list, so adding a tab is a one-line change there rather than here. -->
  <div id="app"></div>
  <nav class="tabbar"></nav>

  <!-- Boot lives in a real file, not inline here, so the Content-Security-
       Policy above can forbid inline scripts entirely. -->
  <script type="module" src="js/boot.js"></script>
</body>
</html>
